# ★ Build performance — tuned for speed
# Daemon keeps the JVM alive between builds (no cold start every time)
org.gradle.daemon=true

# More memory = faster compilation (was 1536m, now 3g)
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=1g -XX:+UseParallelGC -Dfile.encoding=UTF-8 --enable-native-access=ALL-UNNAMED

# Caches
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true

# Android
android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=true
android.builder.sdkDownload=true
