name: Build & Deploy Coral APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    env:
      CORAL_X_KEYSTORE_BASE64: ${{ secrets.CORAL_X_KEYSTORE_BASE64 }}
      CORAL_X_STORE_PASSWORD: ${{ secrets.CORAL_X_STORE_PASSWORD }}
      CORAL_X_KEY_ALIAS: ${{ secrets.CORAL_X_KEY_ALIAS }}
      CORAL_X_KEY_PASSWORD: ${{ secrets.CORAL_X_KEY_PASSWORD }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Decode signing keystore
      run: |
        if [ -n "$CORAL_X_KEYSTORE_BASE64" ]; then
          echo "$CORAL_X_KEYSTORE_BASE64" | base64 -d > coral-x-release.jks
          cat > keystore.properties << 'PROPS_EOF'
        storeFile=coral-x-release.jks
        storePassword=PLACEHOLDER_STORE_PASS
        keyAlias=PLACEHOLDER_KEY_ALIAS
        keyPassword=PLACEHOLDER_KEY_PASS
        PROPS_EOF
          sed -i "s|PLACEHOLDER_STORE_PASS|$CORAL_X_STORE_PASSWORD|g" keystore.properties
          sed -i "s|PLACEHOLDER_KEY_ALIAS|$CORAL_X_KEY_ALIAS|g" keystore.properties
          sed -i "s|PLACEHOLDER_KEY_PASS|$CORAL_X_KEY_PASSWORD|g" keystore.properties
          echo "Keystore decoded"
        else
          echo "No keystore — debug-signed only"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Auto-bump patch version (nightly)
      run: |
        CURRENT_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/.*= *//; s/ *//' | tr -d '"')
        CURRENT_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*= *"//; s/".*//')
        IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT_NAME"
        NEW_PATCH=$((PATCH + 1))
        NEW_NAME="${MAJOR}.${MINOR}.${NEW_PATCH}"
        NEW_CODE=$((MAJOR * 10000 + MINOR * 100 + NEW_PATCH))
        echo "Bumping: $CURRENT_NAME ($CURRENT_CODE) -> $NEW_NAME ($NEW_CODE)"
        sed -i "s/versionCode = .*/versionCode = $NEW_CODE/" app/build.gradle.kts
        sed -i "s/versionName = .*/versionName = \"$NEW_NAME\"/" app/build.gradle.kts
        git config user.name "Coral CI"
        git config user.email "ci@coral.local"
        git add app/build.gradle.kts
        git commit -m "chore: auto-bump to v$NEW_NAME (nightly)" || true
        git push origin main || true

    - name: Build release APK
      run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2

    - name: Rename APK for clean release asset name
      run: |
        VERSION_NAME="${{ steps.version.outputs.version_name }}"
        # steps.version hasn't run yet — read it fresh here
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*= *"//; s/".*//')
        APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
        if [ -n "$APK_PATH" ]; then
          mv "$APK_PATH" "app/build/outputs/apk/release/Coral-v${VERSION_NAME}.apk"
          echo "Renamed to Coral-v${VERSION_NAME}.apk"
        fi

    - name: Get version info
      id: version
      run: |
        VERSION_CODE=$(grep 'versionCode' app/build.gradle.kts | head -1 | sed 's/.*= *//; s/ *//' | tr -d '"')
        VERSION_NAME=$(grep 'versionName' app/build.gradle.kts | head -1 | sed 's/.*= *"//; s/".*//')
        echo "version_code=$VERSION_CODE" >> $GITHUB_OUTPUT
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "tag=v$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "Version: $VERSION_NAME (code: $VERSION_CODE)"
        IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
        if [ "$PATCH" = "0" ]; then
          echo "is_stable=true" >> $GITHUB_OUTPUT
        else
          echo "is_stable=false" >> $GITHUB_OUTPUT
        fi

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.tag }}
        name: Coral ${{ steps.version.outputs.version_name }}
        body: "Coral v${{ steps.version.outputs.version_name }}"
        files: app/build/outputs/apk/release/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload debug APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: coral-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 7

    - name: Upload release APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: coral-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
