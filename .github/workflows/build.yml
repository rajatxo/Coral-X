name: Build Coral-X APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Decode signing keystore
      run: |
        if [ -n "${{ secrets.CORAL_X_KEYSTORE_BASE64 }}" ]; then
          echo "${{ secrets.CORAL_X_KEYSTORE_BASE64 }}" | base64 -d > coral-x-release.jks
          echo "KEYSTORE_FILE=coral-x-release.jks" >> $GITHUB_ENV
          echo "STORE_PASSWORD=${{ secrets.CORAL_X_STORE_PASSWORD }}" >> $GITHUB_ENV
          echo "KEY_ALIAS=${{ secrets.CORAL_X_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "KEY_PASSWORD=${{ secrets.CORAL_X_KEY_PASSWORD }}" >> $GITHUB_ENV
          echo "Keystore decoded successfully"
        else
          echo "No keystore secret found — building unsigned (debug-signed) APK"
        fi

    - name: Create keystore.properties
      run: |
        if [ -n "$KEYSTORE_FILE" ]; then
          cat > keystore.properties << EOF
        storeFile=$KEYSTORE_FILE
        storePassword=$STORE_PASSWORD
        keyAlias=$KEY_ALIAS
        keyPassword=$KEY_PASSWORD
        EOF
          echo "keystore.properties created"
        fi

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build debug APK
      run: ./gradlew :app:assembleDebug --no-daemon --max-workers=2

    - name: Build release APK (if keystore is configured)
      if: env.KEYSTORE_FILE != ''
      run: ./gradlew :app:assembleRelease --no-daemon --max-workers=2

    - name: Upload debug APK
      uses: actions/upload-artifact@v4
      with:
        name: coral-x-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload release APK
      if: env.KEYSTORE_FILE != ''
      uses: actions/upload-artifact@v4
      with:
        name: coral-x-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 30
